name: Build and Push Unraid Image

on:
  schedule:
    - cron: '0 19 * * 5' # At 19:00 on Friday UTC
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'unraid/**'
      - '.github/workflows/unraid_build_push.yml'

jobs:
  build_and_push:
    name: Build and Push nntmux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract tags
        id: meta
        run: |
          echo "date=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nntmux-app:build

      - name: Build and push Unraid image
        uses: docker/build-push-action@v6
        with:
          context: unraid
          push: true
          build-args: |
            APP_IMAGE=nntmux-app:build
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nntmux:bookworm_${{ steps.meta.outputs.date }}
            ${{ secrets.DOCKERHUB_USERNAME }}/nntmux:sha-${{ steps.meta.outputs.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/nntmux:latest
