name: Sync from upstream

on:
  schedule:
    - cron: '0 18 * * 5' # Friday 18:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: Merge NNTmux/newznab-tmux master
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          type=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=master --jq .merge_type)
          echo "merge_type: ${type}"
          # Only rebuild the image when upstream actually changed something.
          if [ "${type}" != "none" ]; then
            gh workflow run unraid_build_push.yml --repo "${GITHUB_REPOSITORY}" --ref master
          fi
