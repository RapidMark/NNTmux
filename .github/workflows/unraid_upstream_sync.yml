name: Weekly update check

on:
  schedule:
    - cron: '0 18 * * 5' # Friday 18:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    name: Upstream, base image and security updates
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork from NNTmux/newznab-tmux
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          type=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=master --jq .merge_type)
          echo "upstream merge: ${type}"
          [ "${type}" != "none" ] && echo "rebuild=true" >> "$GITHUB_OUTPUT" || true

      - name: Check base image and packages
        id: base
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/nntmux:latest
          BASE: dunglas/frankenphp:1-php8.5-bookworm
        run: |
          docker pull -q "${IMAGE}" >/dev/null
          docker pull -q "${BASE}" >/dev/null
          ours=$(date -d "$(docker image inspect -f '{{.Created}}' "${IMAGE}")" +%s)
          base=$(date -d "$(docker image inspect -f '{{.Created}}' "${BASE}")" +%s)
          updates=$(docker run --rm --user root --entrypoint sh "${IMAGE}" -c \
            'apt-get update -qq >/dev/null 2>&1; apt list --upgradable 2>/dev/null' | grep -E 'security|mariadb|manticore|redis' || true)
          echo "base image newer: $([ "${base}" -gt "${ours}" ] && echo yes || echo no)"
          echo "security updates: ${updates:-none}"
          if [ "${base}" -gt "${ours}" ] || [ -n "${updates}" ]; then echo "rebuild=true" >> "$GITHUB_OUTPUT"; fi

      - name: Build image
        if: steps.sync.outputs.rebuild == 'true' || steps.base.outputs.rebuild == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run unraid_build_push.yml --repo "${GITHUB_REPOSITORY}" --ref master
